services:
  # FastAPI backend for the Next.js dashboard (app.emploihq.com)
  - type: web
    name: emploi-api
    runtime: python
    plan: starter          # disks require a paid plan; this service is already deployed on one
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: EMPLOI_API_KEY
        sync: false          # shared secret; must match the web tier's env
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false          # optional AI fallback provider; unset = Gemini only
      - key: JOOBLE_API_KEY
        sync: false          # optional aggregator source; unset = jooble sources no-op
      - key: ADZUNA_APP_ID
        sync: false          # optional aggregator source (needs ADZUNA_APP_KEY too)
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: gb            # default country when an adzuna token omits "country:"
      - key: EMPLOI_DB_PATH
        value: /var/data/emploi.sqlite3
      - key: INTERNAL_SCHEDULER
        value: "true"          # run workers in-process on this always-on
                               # service — no dependency on external cron auth,
                               # and the SOLE scheduler (the duplicate cron
                               # services were removed; see the note below).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false          # unset = /billing/* returns 503, same posture as GEMINI_API_KEY
      - key: PAYSTACK_PRO_PLAN_CODE
        sync: false          # Paystack dashboard > Products > Plans; ₦3,500/mo
      - key: PAYSTACK_MAX_PLAN_CODE
        sync: false          # Paystack dashboard > Products > Plans; ₦7,500/mo
      - key: WEB_APP_URL
        value: https://app.emploihq.com
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: emploi-data
      mountPath: /var/data
      sizeGB: 1

  # ---------------------------------------------------------------------------
  # Scheduled workers run IN-PROCESS on emploi-api via the internal scheduler
  # (INTERNAL_SCHEDULER=true above; see api/main._start_internal_scheduler).
  # That service is the only one with the SQLite disk mounted, and the workers
  # need that disk (Render Cron Jobs can't mount one:
  # https://render.com/docs/disks — "Cron jobs can't provision or access a
  # persistent disk").
  #
  # The separate `type: cron` curl-trigger services that used to live here were
  # REMOVED (2026-07-27). They duplicated the internal scheduler — every worker
  # was scheduled twice, at the same UTC minute, and ran concurrently against
  # one SQLite file on a single 0.5-CPU instance. That double-run caused
  # sustained write-lock + CPU contention, which surfaced as the crons' own
  # `curl` failing: exit 28 (the ingest 202 couldn't return within --max-time
  # while the threadpool was blocked on the DB lock) and exit 22 (a worker
  # raised `database is locked` -> HTTP 500, or the overloaded instance
  # returned 502/503). The internal scheduler is the single source of truth for
  # cadence; the /admin/run/* endpoints remain for manual, one-off triggers.
  # If you ever want external cron instead, disable INTERNAL_SCHEDULER first so
  # the workers are never scheduled from two places at once.
  # ---------------------------------------------------------------------------

  # Legacy Streamlit chat app / future internal admin console
  - type: web
    name: emploi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EMPLOI_ADMIN_CODE
        sync: false          # REQUIRED in prod — without it the console is public
      - key: PYTHON_VERSION
        value: 3.12.0
